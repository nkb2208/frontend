<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LUMI Complete Look</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js?v=1791175212179"></script>
</head>
<body>
<nav class="nav">
  <a class="logo" href="index.html">LUMI</a>
  <div class="navlinks">
    <a href="javascript:history.back()">← Back</a>
    <a href="index.html">Home</a>
  </div>
</nav>

<main class="container">
  <div class="eyebrow">Complete Look</div>
  <h1 id="ed-title">Loading...</h1>
  <p>One look, broken into the pieces you can actually follow or shop.</p>
  
  <div class="grid grid-2">
    <div class="look-img" id="ed-image" style="height:440px"></div>
    <div class="panel">
      <h2>The full combination</h2>
      
      <div class="card" style="margin:12px 0">
        <b>Hair</b>
        <p id="ed-hair-desc">Loading...</p>
        <a class="btn secondary" id="ed-hair-link" href="#">View hair tutorial</a>
      </div>
      
      <div class="card" style="margin:12px 0">
        <b>Makeup</b>
        <p id="ed-makeup-desc">Loading...</p>
        <a class="btn secondary" id="ed-makeup-link" href="#">Open makeup</a>
      </div>
      
      <div class="card" style="margin:12px 0">
        <b>Outfit</b>
        <p id="ed-outfit-desc">Loading...</p>
        <a class="btn secondary" id="ed-outfit-link" href="#">Open outfit</a>
      </div>
    </div>
  </div>
  
  <div class="section-title">
    <div>
      <div class="eyebrow">Shopping</div>
      <h2>Products to complete the look</h2>
    </div>
  </div>
  
  <div class="grid grid-3" id="ed-products">
    <!-- Products injected here -->
  </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    const urlParams = new URLSearchParams(window.location.search);
    const lookId = urlParams.get('look') || 'soft';
    
    try {
        const res = await fetch(`${BACKEND_URL}/api/explore`);
        if (!res.ok) throw new Error("Failed to load");
        const exploreData = await res.json();
        
        const data = exploreData.find(d => d.id === lookId) || exploreData[0];
        
        document.getElementById('ed-title').textContent = data.title;
        const imgBox = document.getElementById('ed-image');
        imgBox.textContent = data.lookImageText;
        
        document.getElementById('ed-hair-desc').innerHTML = \`<b>\${data.components.hair.name}</b> · \${data.components.hair.desc}\`;
        const hairLink = document.getElementById('ed-hair-link');
        hairLink.href = \`tutorial.html?id=\${data.components.hair.id}&category=hair\`;
        hairLink.onclick = () => { localStorage.setItem('lumi_selected_tutorial_id', data.components.hair.id); localStorage.setItem('lumi_selected_tutorial_cat', 'hair'); };
        
        document.getElementById('ed-makeup-desc').innerHTML = \`<b>\${data.components.makeup.name}</b> · \${data.components.makeup.desc}\`;
        const makeupLink = document.getElementById('ed-makeup-link');
        makeupLink.href = \`tutorial.html?id=\${data.components.makeup.id}&category=makeup\`;
        makeupLink.onclick = () => { localStorage.setItem('lumi_selected_tutorial_id', data.components.makeup.id); localStorage.setItem('lumi_selected_tutorial_cat', 'makeup'); };
        
        document.getElementById('ed-outfit-desc').innerHTML = \`<b>\${data.components.outfit.name}</b> · \${data.components.outfit.desc}\`;
        const outfitLink = document.getElementById('ed-outfit-link');
        outfitLink.href = \`tutorial.html?id=\${data.components.outfit.id}&category=outfit\`;
        outfitLink.onclick = () => { localStorage.setItem('lumi_selected_tutorial_id', data.components.outfit.id); localStorage.setItem('lumi_selected_tutorial_cat', 'outfit'); };
        
        const productsContainer = document.getElementById('ed-products');
        productsContainer.innerHTML = data.products.map(p => \`
            <div class="card">
                <h3>\${p.name}</h3>
                <p class="price">\${p.price}</p>
                <a class="btn outline" style="text-decoration:none; display:inline-block; margin-top:10px;" href="\${p.shopee}" target="_blank">Shopee</a>
                <a class="btn outline" style="text-decoration:none; display:inline-block; margin-top:10px;" href="\${p.tiktok}" target="_blank">TikTok Shop</a>
            </div>
        \`).join('');
        } catch(e) {
        console.error("Error loading explore detail:", e);
        const exploreData = [
  {

    tags: ["Campus", "Daytime"],

    components: {
      hair: {
        id: "hair_002",
        name: "Soft Long Layers",
        desc: "gentle waves · face framing"

      makeup: {
        id: "makeup_001",
        name: "Soft Everyday Glow",
        desc: "natural and dewy finish"
      },
      outfit: {

        name: "Korean Minimalist",
        desc: "relaxed top + straight bottoms"
      }
    },
    products: [

      { name: "Kem chống nắng Glow", price: "Từ ₫180,000", shopee: "https://shopee.vn/search?keyword=kem%20chống%20nắng%20glow", tiktok: "https://shop.tiktok.com/view/search?keyword=kem%20chống%20nắng%20glow" },
      { name: "Túi Tote vải", price: "Từ ₫90,000", shopee: "https://shopee.vn/search?keyword=túi%20tote%20vải", tiktok: "https://shop.tiktok.com/view/search?keyword=túi%20tote%20vải" }
    ]
  },
  {
    id: "smart",
    title: "Smart & Polished",
    description: "Sleek straight hair + soft glam makeup + structured outfit.",
    tags: ["Presentation", "Work"],
    lookImageText: "SMART",
    components: {
      hair: {
        id: "hair_004",
        name: "Sleek Straight Glass Hair",

      },
      makeup: {
        id: "makeup_006",
        name: "Soft Glam",
        desc: "defined and confident"
      },

    ]
  },

      },
      outfit: {

        name: "Douyin Streetwear",
        desc: "comfortable casual combination"
      }
    },

      { name: "Kẹp tóc càng cua", price: "Từ ₫25,000", shopee: "https://shopee.vn/search?keyword=kẹp%20tóc%20càng%20cua", tiktok: "https://shop.tiktok.com/view/search?keyword=kẹp%20tóc%20càng%20cua" },

;
        const data = exploreData.find(d => d.id === lookId) || exploreData[0];
        
        document.getElementById('ed-title').textContent = data.title;
        const imgBox = document.getElementById('ed-image');
        imgBox.textContent = data.lookImageText;
        
        document.getElementById('ed-hair-desc').innerHTML = '<b>' + data.components.hair.name + '</b> · ' + data.components.hair.desc;
        const hairLink = document.getElementById('ed-hair-link');
        hairLink.href = 'tutorial.html?id=' + data.components.hair.id + '&category=hair';
        hairLink.onclick = () => { localStorage.setItem('lumi_selected_tutorial_id', data.components.hair.id); localStorage.setItem('lumi_selected_tutorial_cat', 'hair'); };
        
        document.getElementById('ed-makeup-desc').innerHTML = '<b>' + data.components.makeup.name + '</b> · ' + data.components.makeup.desc;
        const makeupLink = document.getElementById('ed-makeup-link');
        makeupLink.href = 'tutorial.html?id=' + data.components.makeup.id + '&category=makeup';
        makeupLink.onclick = () => { localStorage.setItem('lumi_selected_tutorial_id', data.components.makeup.id); localStorage.setItem('lumi_selected_tutorial_cat', 'makeup'); };
        
        document.getElementById('ed-outfit-desc').innerHTML = '<b>' + data.components.outfit.name + '</b> · ' + data.components.outfit.desc;
        const outfitLink = document.getElementById('ed-outfit-link');
        outfitLink.href = 'tutorial.html?id=' + data.components.outfit.id + '&category=outfit';
        outfitLink.onclick = () => { localStorage.setItem('lumi_selected_tutorial_id', data.components.outfit.id); localStorage.setItem('lumi_selected_tutorial_cat', 'outfit'); };
        
        const productsContainer = document.getElementById('ed-products');
        productsContainer.innerHTML = data.products.map(p => 
            '<div class="card">' +
                '<h3>' + p.name + '</h3>' +
                '<p class="price">' + p.price + '</p>' +
                '<a class="btn outline" style="text-decoration:none; display:inline-block; margin-top:10px;" href="' + p.shopee + '" target="_blank">Shopee</a> ' +
                '<a class="btn outline" style="text-decoration:none; display:inline-block; margin-top:10px;" href="' + p.tiktok + '" target="_blank">TikTok Shop</a>' +
            '</div>'
        ).join('');
    }
});
</script>
</body>
</html>
